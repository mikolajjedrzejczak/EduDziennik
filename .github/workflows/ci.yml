# F-502: kontrole PR/push. Bez sekretów, bez deploy (CD: F-503). Zob. docs/infrastructure/CI_CD.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PHP_VERSION: '8.3'
  PHP_EXTENSIONS: pdo_mysql, mbstring, intl, zip, bcmath, dom, xml

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "kind=$(scripts/ci/classify-changes.sh "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: node scripts/ci/check-docs.mjs

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Wayfinder generuje typy tras wymagane przez typecheck/build (katalogi poza Git).
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Losowy APP_KEY i .env z szablonu bez sekretów
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: composer wayfinder
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: public/build/
          if-no-files-found: error
          retention-days: 7

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.kind == 'code'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
        env:
          # Efemeryczna baza usługi na runnerze, bez sekretów i bez publikacji poza job.
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: edudziennik_test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=20s
    env:
      APP_ENV: testing
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: edudziennik_test
      DB_USERNAME: root
      DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer check-platform-reqs
      - name: Losowy APP_KEY i .env z szablonu bez sekretów
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: vendor/bin/pint --test
      - run: composer types:check
      - name: Migracje na pustej bazie testowej
        run: php artisan migrate --force --no-interaction
      - name: PHPUnit (MariaDB 11.4)
        run: composer test
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e
    needs: [changes, frontend]
    # Tymczasowo wyłączone; ustaw zmienną repozytorium ENABLE_E2E=true, aby wznowić.
    if: needs.changes.outputs.kind == 'code' && vars.ENABLE_E2E == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mariadb:
        image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: edudziennik_test
          TZ: UTC
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20 --health-start-period=20s
    env:
      DB_CONNECTION: mariadb
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: edudziennik_test
      DB_USERNAME: root
      DB_PASSWORD: ''
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          tools: composer:v2
          coverage: none
          ini-values: memory_limit=1G
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Losowy APP_KEY i .env z szablonu bez sekretów
        run: |
          cp .env.example .env
          echo "APP_KEY=base64:$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: composer wayfinder
      - run: npm ci
      # Te same assety produkcyjne (bez HMR), zbudowane w jobie frontend dla tego SHA.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-build
          path: public/build
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npm run test:e2e
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-reports
          # Trace/screenshot zawierają wyłącznie fikcyjne dane fixture.
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  required-check:
    name: required-check
    needs: [changes, docs, frontend, backend, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Agregat wymaganych jobów
        env:
          KIND: ${{ needs.changes.outputs.kind }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          E2E_ENABLED: ${{ vars.ENABLE_E2E == 'true' }}
        run: scripts/ci/require-jobs.sh
