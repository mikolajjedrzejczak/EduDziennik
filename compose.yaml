services:
  db:
    image: mariadb:11.4@sha256:5e73baf8179b29f115101bb102763a47a017361f3e9792daccba6646c3ab1532
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-edudziennik}
      MARIADB_USER: ${DB_USERNAME:-edudziennik}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Ustaw DB_PASSWORD w .env}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Ustaw MARIADB_ROOT_PASSWORD w .env}
      TZ: UTC
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      DB_HOST: db
      DB_PORT: 3306
      TZ: UTC
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong']
      interval: 5s
      timeout: 5s
      retries: 12
  nginx:
    image: nginx:stable-alpine@sha256:901e593c95dc85f5a729f5765516321366ef4ac401821431d408897e95287d0a
    ports:
      - '127.0.0.1:${APP_PORT:-8080}:80'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/up']
      interval: 5s
      timeout: 5s
      retries: 12
  node:
    profiles: [dev]
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    environment:
      WAYFINDER_EXTERNAL: 'true'
      VITE_PORT: ${VITE_PORT:-5173}
    ports:
      - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    volumes:
      - .:/var/www/html
      - node_modules:/var/www/html/node_modules
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(\"http://127.0.0.1:$${VITE_PORT}/@vite/client\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
  vendor:
  node_modules:
